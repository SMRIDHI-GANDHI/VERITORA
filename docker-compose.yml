services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: veritrust
      POSTGRES_PASSWORD: veritrust
      POSTGRES_DB: veritrust
    ports:
      - "5432:5432"
    volumes:
      - veritora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritrust -d veritrust"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://veritrust:veritrust@db:5432/veritrust
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  veritora_pgdata:
