name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Typecheck
        working-directory: backend
        run: mypy app
      - name: Test
        working-directory: backend
        run: pytest -q --ignore=tests/integration_db
      - name: Audit
        working-directory: backend
        run: pip-audit || true

  backend-integration-db:
    name: backend-integration-db (postgresql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritrust
          POSTGRES_PASSWORD: veritrust
          POSTGRES_DB: veritrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veritrust -d veritrust_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://veritrust:veritrust@localhost:5432/veritrust_test
      SECRET_KEY: ci-test-secret-key-not-for-production-123456
      NETWORK_HMAC_KEY: ci-test-network-hmac-key-not-for-production-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Migrate isolated CI database
        working-directory: backend
        run: alembic upgrade head
      - name: Database-backed integration tests
        working-directory: backend
        run: |
          set -euo pipefail
          status=0
          python -m pytest -q tests/integration_db --junitxml=integration-db-junit.xml || status=$?
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = "integration-db-junit.xml"
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              print(f"ERROR: failed to read pytest JUnit report ({path}): {exc}", file=sys.stderr)
              sys.exit(1)

          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              print("ERROR: no testsuite found in pytest JUnit report", file=sys.stderr)
              sys.exit(1)

          tests = int(suite.attrib.get("tests", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          expected = 3

          print(
              f"integration_db summary: tests={tests} failures={failures} "
              f"errors={errors} skipped={skipped} expected={expected}"
          )

          if tests != expected:
              print(
                  f"ERROR: expected exactly {expected} executed tests, got {tests}",
                  file=sys.stderr,
              )
              sys.exit(1)
          if failures or errors or skipped:
              print(
                  "ERROR: integration_db tests must have zero failures, errors, and skips",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          exit "$status"
      - name: Migration status check
        working-directory: backend
        run: alembic current

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: frontend-e2e (playwright + axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritrust
          POSTGRES_PASSWORD: veritrust
          POSTGRES_DB: veritrust_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veritrust -d veritrust_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://veritrust:veritrust@localhost:5432/veritrust_e2e
      SECRET_KEY: ci-test-secret-key-not-for-production-123456
      NETWORK_HMAC_KEY: ci-test-network-hmac-key-not-for-production-123456
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RATE_LIMIT_DEFAULT: 1000/minute
      E2E_API_URL: http://127.0.0.1:8000/api/v1
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Migrate and seed isolated e2e database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.scripts.seed_demo
      - name: Install frontend
        working-directory: frontend
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e and axe checks
        working-directory: frontend
        run: npm run test:e2e -- --reporter=line,html
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
