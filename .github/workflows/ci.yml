name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritrust
          POSTGRES_PASSWORD: veritrust
          POSTGRES_DB: veritrust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U veritrust -d veritrust"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Typecheck
        working-directory: backend
        run: mypy app
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://veritrust:veritrust@localhost:5432/veritrust
        run: pytest -q
      - name: Migration check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://veritrust:veritrust@localhost:5432/veritrust
        run: alembic upgrade head
      - name: Audit
        working-directory: backend
        run: pip-audit || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
